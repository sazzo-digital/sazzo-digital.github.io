<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0B1210">
    <title>No encontramos esa página · Sazzo</title>
    <!-- Página de error de GitHub Pages (un link mal escrito o viejo). No usa otros archivos: anda desde cualquier dirección. -->
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box;
               background: #0b1210; color: #e6efeb; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
        main { max-width: 26rem; }
        h1 { font-size: 1.6rem; margin: 1.2rem 0 .5rem; }
        p { color: #8a9a94; margin: 0 0 1.6rem; }
        a { display: inline-block; padding: .8rem 1.4rem; border-radius: 12px; background: #34d399; color: #04120c; font-weight: 700; text-decoration: none; }
        a:focus-visible { outline: 3px solid #e6efeb; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <svg viewBox="0 0 100 100" width="72" height="72" aria-hidden="true">
            <rect width="100" height="100" rx="22" fill="#111816"/>
            <path fill="none" stroke-width="10" stroke-linecap="round" stroke="#E6EFEB" d="M40.26 38.75 A13 7.5 0 1 0 29 50 A13 7.5 0 1 1 17.74 61.25"/>
            <path fill="none" stroke="#34D399" stroke-width="9" stroke-linecap="round" d="M58 64 H82"/>
        </svg>
        <h1>No encontramos esa página</h1>
        <p>Puede que el link esté mal escrito o sea viejo. Todas las demos están en el catálogo.</p>
        <a href="/">Ir al catálogo de demos</a>
    </main>
</body>
</html>
