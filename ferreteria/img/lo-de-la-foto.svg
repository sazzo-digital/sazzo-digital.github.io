<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Una canilla de 1/2 pulgada que pierde agua">
  <!-- "Lo de la foto" de la demo Ferretería: un dibujo (no es una foto real ni de ninguna marca) de la canilla que se
       le rompió a Marcos. Azulejos de fondo, la canilla de bronce con su manija y una gota cayendo. -->
  <defs>
    <linearGradient id="bronce" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9c46a"/>
      <stop offset="0.55" stop-color="#c8963e"/>
      <stop offset="1" stop-color="#8a6526"/>
    </linearGradient>
    <linearGradient id="manija" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c0392b"/>
      <stop offset="1" stop-color="#8e2a20"/>
    </linearGradient>
    <pattern id="azulejos" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#dfe7ea"/>
      <path d="M40 0H0V40" fill="none" stroke="#c4d0d5" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="320" height="240" fill="url(#azulejos)"/>
  <!-- caño que sale de la pared -->
  <rect x="0" y="92" width="70" height="26" rx="3" fill="#b9c2c6"/>
  <rect x="62" y="84" width="22" height="42" rx="4" fill="url(#bronce)"/>
  <!-- cuerpo de la canilla -->
  <rect x="82" y="88" width="96" height="34" rx="10" fill="url(#bronce)"/>
  <circle cx="132" cy="105" r="24" fill="url(#bronce)"/>
  <!-- manija (palanca) -->
  <rect x="124" y="46" width="16" height="40" rx="4" fill="#9a7a3a"/>
  <rect x="100" y="34" width="96" height="18" rx="9" fill="url(#manija)"/>
  <!-- pico -->
  <path d="M172 96 h34 a14 14 0 0 1 14 14 v34 h-22 v-26 h-26 z" fill="url(#bronce)"/>
  <rect x="196" y="142" width="26" height="10" rx="3" fill="#7a5a20"/>
  <!-- la pérdida: gotas -->
  <path d="M209 160 c-6 10 -8 14 -8 18 a8 8 0 0 0 16 0 c0 -4 -2 -8 -8 -18 z" fill="#4aa3df"/>
  <path d="M209 196 c-4 7 -5 9 -5 12 a5 5 0 0 0 10 0 c0 -3 -1 -5 -5 -12 z" fill="#4aa3df" opacity="0.8"/>
  <!-- marca de "pierde" en la rosca -->
  <path d="M86 128 q-4 10 0 18" fill="none" stroke="#4aa3df" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="210" cy="226" rx="26" ry="5" fill="#4aa3df" opacity="0.35"/>
</svg>
